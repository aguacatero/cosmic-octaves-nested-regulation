name: rigor-adjudicator
on:
  pull_request:
  push:
    branches: [main, jev-rigor-adjudication-spec]
jobs:
  offline-rigor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/rigor-adjudicator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/rigor-adjudicator/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
